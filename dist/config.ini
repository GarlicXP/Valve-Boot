[Video]
; 播放模式：sequential=顺序循环（默认），random=随机
Mode=random
; 视频文件夹（相对本目录），支持 wmv/mp4/avi/mkv/mov/mpg
VideoFolder=videos
; 最大阻塞毫秒（1000~60000），默认 25000
HoldMs=60000

[Update]
AutoUpdate=1
; 1=软件自更新（GitHub Releases 下载替换+静默注册） 0=关闭
; 是否启用 GitHub 自动同步（1=启用，0=关闭；修改后下次检查生效）
Enabled=1
; GitHub 仓库（owner/repo）
Repo=GarlicXP/Valve-Boot
; 仓库中存放视频的文件夹（GitHub 上，注意与本地 videos 区分）
RepoFolder=video
; 检查间隔（分钟，1~1440）
IntervalMin=5

[Audio]
; 输出设备：留空=自动避开虚拟设备选物理扬声器；
; 填关键词（如 DeviceName=Realtek）则锁定到名称含该关键词的设备
;DeviceName=Realtek
